<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        
        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;                             
            max-width: 900px;
            width: 100%;
        }

       
        .slot-card {
            background-color: #ffffff;
            border: 2px dashed #cbd5e1; 
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .slot-card:hover {
            border-color: #3b82f6;
            border-style: solid;
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.15);
        }

        
        .image-box {
            width: 100%;
            height: 180px; 
            border-radius: 8px;
            overflow: hidden;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        
        .slot-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .slot-desc {
            font-size: 0.85rem;
            color: #64748b;
        }

        
        @media (max-width: 768px) {
            .grid-3x3 {
                grid-template-columns: repeat(2, 1fr); 
            }
        }
        @media (max-width: 480px) {
            .grid-3x3 {
                grid-template-columns: 1fr; 
            }
        }
        .tombol { display: inline-block; background: #25d366; color: #fff; padding: 8px 14px;
              border-radius: 20px; text-decoration: none; margin-top: 8px; }
    </style>
</head>
